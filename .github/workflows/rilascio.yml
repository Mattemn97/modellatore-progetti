# --- RILASCIO ---
# Compila start.exe e crea lo zip (vedi packaging/crea-pacchetto.ps1).
# - push su main (merge o commit diretto): pubblica una GitHub Release con versione automatica,
#   la patch dell'ultimo tag v* più uno (v1.0.0 se non ce ne sono)
# - push di un tag v* (es. v2.0.0): pubblica la Release con quella versione, serve per alzare minor o major
# - avvio manuale (Actions > Rilascio > Run workflow): solo artifact scaricabile dall'esecuzione
# La descrizione della Release è il messaggio del commit (vedi .github/scripts/note-rilascio.sh).
name: Rilascio

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Un rilascio alla volta, così due push ravvicinati non calcolano la stessa versione
concurrency:
  group: rilascio
  cancel-in-progress: false

jobs:
  pacchetto:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze di build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Versione
        id: versione
        shell: bash
        run: |
          pubblica=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"; pubblica=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            if [ -n "$(git tag --points-at HEAD -l 'v*')" ]; then
              # Il commit ha già un tag v*: la Release la pubblica l'esecuzione partita dal tag
              v="dev-${GITHUB_SHA:0:7}"
            else
              ultimo="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
              if [ -z "$ultimo" ]; then v="1.0.0"
              else
                IFS=. read -r ma mi pa <<< "${ultimo#v}"
                v="$ma.$mi.$((${pa%%[!0-9]*} + 1))"
              fi
              pubblica=true
            fi
          else
            v="dev-${GITHUB_SHA:0:7}"
          fi
          echo "valore=$v" >> "$GITHUB_OUTPUT"
          echo "pubblica=$pubblica" >> "$GITHUB_OUTPUT"
          echo "Versione $v, pubblica Release: $pubblica"

      - name: Compila e impacchetta
        shell: pwsh
        run: ./packaging/crea-pacchetto.ps1 -Versione "${{ steps.versione.outputs.valore }}"

      - name: Prova di avvio di start.exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/pacchetto/ModellatoreMBSE/start.exe" -WorkingDirectory "dist/pacchetto/ModellatoreMBSE" -PassThru -RedirectStandardOutput "dist/avvio.txt"
          try {
            $ok = $false
            for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
              Start-Sleep -Seconds 1
              try { $r = Invoke-WebRequest "http://127.0.0.1:8080/index.html" -UseBasicParsing; $ok = $r.StatusCode -eq 200 } catch {}
            }
            if (-not $ok) { throw "start.exe non risponde su http://127.0.0.1:8080" }
            Write-Host "start.exe risponde correttamente"
            # settings.json creato dai valori di fabbrica (spec 0013)
            $cartella = "dist/pacchetto/ModellatoreMBSE"
            if (-not (Test-Path "$cartella/settings.json")) { throw "start.exe non ha creato settings.json" }
            if ((Get-FileHash "$cartella/settings.json").Hash -ne (Get-FileHash "$cartella/settings.predefinite.json").Hash) {
              throw "settings.json non è uguale a settings.predefinite.json"
            }
            Write-Host "settings.json creato da settings.predefinite.json"
            # Riquadro della console scritto con rich, non con la riserva in testo semplice (spec 0014)
            $avvio = Get-Content "dist/avvio.txt" -Raw -Encoding utf8
            Write-Host $avvio
            if (-not $avvio.Contains("http://localhost:8080")) { throw "L'uscita di start.exe non contiene il link dell'app" }
            if (-not $avvio.Contains([string][char]0x2502)) { throw "L'uscita di start.exe non ha il riquadro di rich" }
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - uses: actions/upload-artifact@v4
        with:
          name: ModellatoreMBSE-${{ steps.versione.outputs.valore }}
          path: dist/ModellatoreMBSE-*.zip

      - name: Note di rilascio
        if: steps.versione.outputs.pubblica == 'true'
        shell: bash
        run: bash .github/scripts/note-rilascio.sh "$GITHUB_SHA" > dist/note-rilascio.md

      - name: Pubblica la Release
        if: steps.versione.outputs.pubblica == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.versione.outputs.valore }}
        run: |
          # Su main il tag non esiste ancora: gh lo crea sul commit indicato da --target
          gh release create "$env:TAG" `
            (Get-ChildItem dist/ModellatoreMBSE-*.zip).FullName `
            --target "$env:GITHUB_SHA" `
            --title "Modellatore MBSE $env:TAG" --notes-file dist/note-rilascio.md
