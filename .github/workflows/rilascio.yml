# --- RILASCIO DELLA VERSIONE DESKTOP (spec 0026) ---
# Su ogni push a main: verifica completa, setup Windows per utente, prova del programma impacchettato e
# GitHub Release v<version di package.json> con setup, blockmap, latest.yml (per l'aggiornamento automatico),
# tutorial ed esempio. Se il tag v<version> esiste già non pubblica niente: per un rilascio nuovo si alza
# "version" in package.json. Le note sono packaging/note/<version>.md se c'è, altrimenti il messaggio del commit.
# Avvio manuale (Actions > Rilascio > Run workflow): solo il setup come artifact.
# Segreti: nessuno, basta il GITHUB_TOKEN dell'esecuzione (permesso contents: write).
name: Rilascio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Un rilascio alla volta
concurrency:
  group: rilascio
  cancel-in-progress: false

jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dipendenze
        run: npm ci

      - name: Binario di Electron
        run: node node_modules/electron/install.js

      - name: Versione
        id: versione
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "La versione $v di package.json non è x.y.z: niente Release"; pubblica=false
          elif [ -n "$(git tag -l "v$v")" ]; then
            echo "Il tag v$v esiste già: alza version in package.json per pubblicare"; pubblica=false
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            pubblica=true
          else
            pubblica=false
          fi
          echo "valore=$v" >> "$GITHUB_OUTPUT"
          echo "pubblica=$pubblica" >> "$GITHUB_OUTPUT"
          echo "Versione $v, pubblica Release: $pubblica"

      - name: Verifica completa
        run: npm run verifica

      - name: Costruzione del setup
        run: npm run dist

      - name: Prova del programma impacchettato
        shell: pwsh
        run: |
          $env:MODELLATORE_ESEGUIBILE_INSTALLATO = (Resolve-Path "release/win-unpacked/Modellatore MBSE.exe").Path
          npx playwright test tests/e2e/installato.spec.ts

      - name: Tutorial ed esempio
        shell: bash
        run: |
          v="${{ steps.versione.outputs.valore }}"
          sed "s/{VERSIONE}/$v/g" packaging/TUTORIAL.md > release/TUTORIAL.md
          cp packaging/esempi/requisiti_cliente_esempio.csv release/

      - uses: actions/upload-artifact@v4
        with:
          name: Modellatore-MBSE-${{ steps.versione.outputs.valore }}
          path: |
            release/Modellatore-MBSE-Setup-*.exe
            release/latest.yml
            release/TUTORIAL.md
          retention-days: 14

      - name: Note di rilascio
        if: steps.versione.outputs.pubblica == 'true'
        shell: bash
        run: |
          note="packaging/note/${{ steps.versione.outputs.valore }}.md"
          if [ -f "$note" ]; then cp "$note" release/note-rilascio.md
          else bash .github/scripts/note-rilascio.sh "$GITHUB_SHA" > release/note-rilascio.md; fi

      - name: Pubblica la Release
        if: steps.versione.outputs.pubblica == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.versione.outputs.valore }}
        run: |
          $file = @(
            (Get-ChildItem release/Modellatore-MBSE-Setup-*.exe).FullName
            (Get-ChildItem release/Modellatore-MBSE-Setup-*.exe.blockmap).FullName
            "release/latest.yml", "release/TUTORIAL.md", "release/requisiti_cliente_esempio.csv"
          )
          # Il tag non esiste ancora: gh lo crea sul commit indicato da --target; --latest per l'aggiornamento automatico
          gh release create "$env:TAG" @file --target "$env:GITHUB_SHA" --latest `
            --title "Modellatore MBSE $env:TAG" --notes-file release/note-rilascio.md
