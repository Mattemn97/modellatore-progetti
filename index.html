<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modellatore di Requisiti a Blocchi - MBSE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header" id="header">
        <button class="back-btn" id="backBtn" style="display: none;">&larr; Indietro</button>
        <div class="breadcrumb" id="breadcrumb"></div>

        <!-- Stato del salvataggio automatico, annulla/ripeti e menu Progetto (js/progetto.js) -->
        <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
            <span id="badgeSalvataggio" class="badge-salvataggio stato-salvato" hidden>Salvato</span>
            <button id="btnAnnulla" class="pulsante-progetto" title="Annulla (Ctrl+Z)" disabled>&#8630; Annulla</button>
            <button id="btnRipeti" class="pulsante-progetto" title="Ripeti (Ctrl+Y)" disabled>&#8631; Ripeti</button>
            <div class="menu-progetto">
                <button id="btnMenuProgetto" class="pulsante-progetto pulsante-menu">Progetto &#9662;</button>
                <div id="menuProgetto" class="menu-progetto-voci" hidden>
                    <button data-azione="nuovo">Nuovo…</button>
                    <button data-azione="apri">Apri…</button>
                    <button data-azione="copia">Salva una copia come…</button>
                    <button data-azione="rinomina">Rinomina…</button>
                    <button data-azione="elimina">Elimina</button>
                    <hr>
                    <button data-azione="importa">Importa JSON…</button>
                    <button data-azione="scarica">Scarica JSON</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Errori di salvataggio, conflitti e avvisi sulla libreria -->
    <div id="bannerProgetto" class="banner-progetto" hidden></div>

    <div class="main-area">
        <!-- COLONNA SINISTRA (1/5): Solo Libreria -->
        <div class="side-panel left-panel" id="libraryPanel">
            <h3>Libreria Blocchi</h3>
            
            <!-- Configurazione e ricarica da Path/URL -->
            <div style="margin-bottom: 10px; background: #f0f4f8; padding: 8px; border-radius: 4px; border: 1px solid #d0d7de;">
                <label style="font-size: 11px; font-weight: bold; color: #555; display: block; margin-bottom: 3px;">Percorso / URL Libreria:</label>
                <div style="display: flex; gap: 4px;">
                    <input type="text" id="libPathInput" placeholder="es. shared/libreria.json" style="flex: 1; padding: 4px; font-size: 11px; border: 1px solid #ccc; border-radius: 3px;">
                    <button id="btnLoadFromPath" style="background: #0078d4; color: white; border: none; border-radius: 3px; padding: 0 8px; cursor: pointer; font-size: 11px;" title="Ricarica da Path">🔄</button>
                </div>
            </div>

            <input type="text" id="libSearchInput" placeholder="🔍 Cerca nella libreria..." style="width: 100%; padding: 6px; margin-bottom: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 12px;">
            <div id="libraryContent" style="flex: 1; overflow-y: auto; border: 1px solid #eee; padding: 5px; border-radius: 4px;"></div>
        </div>

        <!-- COLONNA CENTRALE (3/5): Canvas -->
        <div class="canvas-container" id="canvasContainer">
            <div class="canvas-toolbar">
                <button id="toggleLeftBtn">☰ Libreria</button>
                
                <div style="display: flex; align-items: center; gap: 8px; font-size: 12px;">
                    <label for="filterTypeSelect">Filtra Tipologia:</label>
                    <!-- Opzioni generate da app.js a partire da settings.json -->
                    <select id="filterTypeSelect" style="padding: 3px 6px; font-size: 12px; border-radius: 4px; border: 1px solid #ccc;"></select>
                    
                    <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; margin-left: 8px;">
                        <input type="checkbox" id="chkOmitUninvolved"> Nascondi Non Coinvolti
                    </label>

                    <button id="btnReqMatrix" style="background: #0078d4; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; margin-left: 10px;">📊 Matrice Requisiti</button>
                    <button id="btnDRC" style="background: #f39c12; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;">⚠️ Verifica Coerenza</button>
                    <button id="btnResetView" style="background: #95a5a6; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;">🔍 Reset Vista</button>
                </div>

                <button id="toggleRightBtn">☰ Proprietà</button>
            </div>

            <svg id="workspaceSvg">
                <defs>
                    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="1"/>
                    </pattern>
                </defs>
                <rect id="gridBackground" width="100%" height="100%" fill="url(#grid)" />
                <g id="viewport">
                    <g id="edgesLayer"></g>
                    <!-- Blocchi tondi del padre sopra i fili, così i loro pin restano cliccabili -->
                    <g id="parentLayer"></g>
                    <g id="nodesLayer"></g>
                </g>
            </svg>
        </div>

        <!-- COLONNA DESTRA (1/5): Proprietà -->
        <div class="side-panel right-panel" id="propertiesPanel">
            <div id="propsHeader" style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0;">Ispettore & Gestione</h3>
                <button id="btnNewBlockFromScratch" style="background:#27ae60; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px;">+ Nuovo Blocco</button>
            </div>
            <div id="propsContent" style="margin-top:10px;">
                <div class="empty-props">Seleziona un blocco o creane uno nuovo...</div>
            </div>
        </div>
    </div>
</div>

<!-- Modale Report (Matrice Requisiti e DRC) -->
<div id="reportModal" class="modal-overlay" style="display: none;">
    <div class="modal-body">
        <div class="modal-header">
            <h3 id="modalTitle">Titolo Report</h3>
            <button id="btnCloseModal" style="border:none; background:none; font-size:18px; cursor:pointer;">✕</button>
        </div>
        <div id="modalContent" style="max-height: 400px; overflow-y: auto; margin-top: 10px;"></div>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
